packages:
  - "apps/*"
  - "packages/*"

settings:
  blockExoticSubdeps: true
  minimumReleaseAge: 10080
  trustPolicy: "no-downgrade"

# Packages reconnus nécessitant un script de build natif (compilation bcrypt,
# génération du client Prisma, binaires sharp) — approuvés explicitement
# plutôt que via le prompt interactif `pnpm approve-builds`.
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "bcrypt"
  - "prisma"
  - "sharp"
